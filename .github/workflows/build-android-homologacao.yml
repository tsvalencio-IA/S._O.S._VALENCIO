name: "APK Android - S.O.S. Valencio (homologacao)"
on:
  push:
    branches: [homologacao]
    paths:
      - 'capacitor-android/capacitor.config.js'
      - 'js/theme.js'
      - 'js/sos-all-fields-voice.js'
      - 'jarvis.html'
      - 'index.html'
      - 'js/jarvis-mobile-fit-v1.js'
      - 'js/jarvis-equipe-status-v1.js'
      - 'equipe.html'
      - 'css/android-app.css'
      - 'capacitor-android/android-overrides/**'
      - 'scripts/prepare-capacitor-www.sh'
      - 'scripts/build-android-homologacao.sh'
      - 'scripts/render-android-icon.py'
      - 'assets/sos-valencio-android-icon.svg'
      - '.github/workflows/build-android-homologacao.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-android-homologacao
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch de homologacao
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Aceitar licencas do Android SDK do runner
        shell: bash
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_path="$(find "$sdkroot/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -1)"
          test -n "$sdkmanager_path"
          test -x "$sdkmanager_path"
          echo "SDK: $sdkmanager_path"
          set +o pipefail
          yes | "$sdkmanager_path" --licenses
          rc=${PIPESTATUS[1]}
          set -o pipefail
          test "$rc" -eq 0
          "$sdkmanager_path" --list_installed >/dev/null

      - name: Verificar app e origem segura
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const c = require('./capacitor-android/capacitor.config.js');
          if (c.appId !== 'br.com.thiaguinho.saas') throw Error('Identidade Android inesperada');
          if (c.server?.url !== 'https://tsvalencio-ia.github.io/S._O.S._VALENCIO/selecionar-perfil.html?sos_app=android') throw Error('Origem web inesperada');
          if (!c.plugins?.Camera || !c.plugins?.StatusBar) throw Error('Plugins preexistentes ausentes');
          console.log('Configuração Android segura e identidade preservada.');
          NODE
          node --check js/ia.js
          node --check js/theme.js
          grep -q 'html.sos-premium-ui' css/android-app.css
          grep -q "sos_valencio_android_shell" js/theme.js
          grep -Fq 'js/ia.js?v=26.25.4' jarvis.html
          grep -Fq 'const exatos=clientes.filter' js/ia.js
          node --check js/sos-native-speech.js
          grep -Fq 'registerPlugin(SosSpeechInputPlugin.class)' capacitor-android/android-overrides/MainActivity.java

      - name: Preparar arquivos web atuais
        run: bash scripts/prepare-capacitor-www.sh

      - name: Instalar Capacitor
        working-directory: capacitor-android
        run: npm install --no-audit --no-fund

      - name: Gerar plataforma Android
        working-directory: capacitor-android
        run: |
          npx cap add android
          npx cap sync android

      - name: Aplicar integrações Android existentes
        run: bash scripts/build-android-homologacao.sh

      - name: Criar icones Android nativos sem alterar o site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sos-icon-venv"
          "$RUNNER_TEMP/sos-icon-venv/bin/pip" install --quiet --disable-pip-version-check cairosvg Pillow
          "$RUNNER_TEMP/sos-icon-venv/bin/python" scripts/render-android-icon.py
          "$RUNNER_TEMP/sos-icon-venv/bin/python" scripts/render-web-icons.py

      - name: Compilar APK Android instalavel de teste
        working-directory: capacitor-android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Conferir integridade do APK
        shell: bash
        run: |
          set -euo pipefail
          apk=capacitor-android/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" | tail -1
          sha256sum "$apk"
          cp "$apk" "SOS-Valencio-homologacao-${GITHUB_RUN_NUMBER}.apk"

      - name: Disponibilizar APK para instalacao e teste
        uses: actions/upload-artifact@v4
        with:
          name: SOS-Valencio-Android-homologacao
          path: SOS-Valencio-homologacao-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Atualizar ícones PWA no branch homologacao apos APK valido
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sos-valencio-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "fix(pwa): usar icone oficial SOS Valencio no Chrome"
            git push origin HEAD:homologacao
          else
            echo "Icones PWA ja correspondem ao SVG oficial."
          fi

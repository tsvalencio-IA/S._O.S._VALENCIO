name: APK Android - S.O.S. VALENCIO Homologacao
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-homologacao-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-android:
    name: APK Android de teste
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exclusivo de homologacao
        uses: actions/checkout@v4
        with:
          ref: homologacao
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Pacote de testes separado do aplicativo de producao
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('capacitor-android/capacitor.config.js')
          s=p.read_text(encoding='utf-8')
          assert "appId: 'br.com.thiaguinho.saas'" in s
          s=s.replace("appId: 'br.com.thiaguinho.saas'", "appId: 'br.com.thiaguinho.saas.homologacao'")
          s=s.replace("appName: 'thIAguinho SaaS'", "appName: 'S.O.S. VALENCIO TESTE'")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Preparar Web original em www
        run: |
          chmod +x scripts/prepare-capacitor-www.sh
          ./scripts/prepare-capacitor-www.sh
      - name: Dependencias Android
        working-directory: capacitor-android
        run: npm install --no-audit --no-fund
      - name: Adicionar projeto nativo
        working-directory: capacitor-android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Sincronizar
        working-directory: capacitor-android
        run: npx cap sync android
      - name: Overrides Android originais
        run: |
          if [ -d capacitor-android/android-overrides ]; then
            cp -R capacitor-android/android-overrides/* capacitor-android/android/app/src/main/
          fi
      - name: Compilar APK Debug
        working-directory: capacitor-android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Preparar APK instalavel
        run: |
          mkdir -p apk-teste
          cp capacitor-android/android/app/build/outputs/apk/debug/app-debug.apk apk-teste/SOS-VALENCIO-HOMOLOGACAO.apk
          test -s apk-teste/SOS-VALENCIO-HOMOLOGACAO.apk
      - name: APK para download
        uses: actions/upload-artifact@v4
        with:
          name: SOS-VALENCIO-ANDROID-TESTE
          path: apk-teste/SOS-VALENCIO-HOMOLOGACAO.apk
          if-no-files-found: error
          retention-days: 30

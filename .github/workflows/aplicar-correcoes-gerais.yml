name: Aplicar correcoes gerais SAAS-2 em homologacao
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-correcoes-gerais.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar-correcoes:
    name: Patch e testes sem acessar Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exclusivo da homologacao
        uses: actions/checkout@v4
        with:
          ref: homologacao
          fetch-depth: 1
      - name: Confirmar contexto e branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "homologacao"
          test -f ci/patch-homologacao-20261010.diff
      - name: Aplicar patch com verificacao previa
        shell: bash
        run: |
          set -euo pipefail
          if [ -e TESTES_REGRESSAO_SOS_VALENCIO.js ]; then
            echo "::error::Patch possivelmente ja aplicado; nao duplicar."
            exit 1
          fi
          sha256sum js/cilia.js js/cilia-api.js js/tabela-tempa.js js/exportar-pmsp.js > /tmp/antes.sha
          git apply --check ci/patch-homologacao-20261010.diff
          git apply ci/patch-homologacao-20261010.diff
          sha256sum -c /tmp/antes.sha
          git diff --check
      - name: Testar logicas com dados simulados
        run: node TESTES_REGRESSAO_SOS_VALENCIO.js
      - name: Validar JavaScript e JSON
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          node --check TESTES_REGRESSAO_SOS_VALENCIO.js
          python3 - <<'PY'
          import json,pathlib
          for f in pathlib.Path('.').rglob('*.json'):
              if 'node_modules' in f.parts: continue
              json.loads(f.read_text(encoding='utf-8-sig'))
          print('JSON: valido')
          PY
      - name: Commit de homologacao sem deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "S.O.S. VALENCIO CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: integrar fluxo *177, reabertura, evidencias, comissoes e classificacao fiscal"
          git push origin HEAD:homologacao

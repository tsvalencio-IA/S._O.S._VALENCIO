name: Integracao RC Android Web Windows
# RC4: PDF com data/hora minima; fotos na Plan1 do XLSX PMSP, depois das assinaturas.
# RC PDF: data/hora integrada ao quadro de cada foto, sem listagem cronologica.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integracao-rc.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regressao e sintaxe
        run: |
          set -euo pipefail
          for f in js/ia.js js/os.js js/os-utils.js js/comissoes-os-v21.js js/core.js js/nfe-real-pro.js; do node --check "$f"; done
          node TESTES_REGRESSAO_SOS_VALENCIO.js
          node TESTES_IA_PERIODOS_E_FLUXOS_20261010.js
          node TESTES_PERMISSOES_20261010.js
          node TESTES_FOTOS_OS_PDF_XLSX_20261012.js
          if git ls-files | grep -Ei '\.(jks|keystore|p12|pfx)$'; then echo "Segredo bloqueado"; exit 1; fi
  android-web:
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Web e fonte
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-web.sh
          mkdir -p saida
          (cd web-dist && zip -q -r ../saida/SOS-VALENCIO-WEB-PWA.zip .)
          git archive --format=zip HEAD -o saida/SOS-VALENCIO-CODIGO-COMPLETO.zip
      - name: Identificador Android separado e conteudo atualizado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('capacitor-android/capacitor.config.js')
          s=p.read_text()
          a="appId: 'br.com.thiaguinho.saas'"
          assert s.count(a)==1
          s=s.replace(a,"appId: 'br.com.thiaguinho.saas.homologacao'")
          s=s.replace("appName: 'thIAguinho SaaS'","appName: 'S.O.S. VALENCIO TESTE'")
          p.write_text(s)
          PY
          chmod +x scripts/prepare-capacitor-www.sh
          ./scripts/prepare-capacitor-www.sh
          for f in ia.js os.js core.js comissoes-os-v21.js; do cmp "js/$f" "capacitor-android/www/js/$f"; done
          cmp js/os-evidencias-export.js capacitor-android/www/js/os-evidencias-export.js
          cmp js/exportar-pmsp.js capacitor-android/www/js/exportar-pmsp.js
          cmp clienteOficial.html capacitor-android/www/clienteOficial.html
      - name: Capacitor
        working-directory: capacitor-android
        run: |
          npm install --no-audit --no-fund
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Sobrescrever manifest Android conforme original
        run: |
          if [ -d capacitor-android/android-overrides ]; then cp -R capacitor-android/android-overrides/* capacitor-android/android/app/src/main/; fi
      - name: APK debug
        working-directory: capacitor-android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Enviar pacotes para Release PRIVADA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp capacitor-android/android/app/build/outputs/apk/debug/app-debug.apk saida/SOS-VALENCIO-ANDROID-TESTE.apk
          printf 'Commit: %s\nBanco: Firebase original, sem isolamento\nUso: apenas homologacao, NAO certificado para producao\n' "$(git rev-parse HEAD)" > saida/LEIA_ANTES.txt
          (cd saida && sha256sum SOS-VALENCIO-*.zip SOS-VALENCIO-*.apk > SHA256SUMS.txt)
          gh release create "rc-integrada-${GITHUB_RUN_NUMBER}" saida/* --repo "${GITHUB_REPOSITORY}" --target "$(git rev-parse HEAD)" --prerelease --title "S.O.S. VALENCIO - candidato Android Web PC ${GITHUB_RUN_NUMBER}" --notes "Homologacao. Firebase usa configuracao original; nao alterar dados reais. Nao e versao final certificada."
  windows:
    needs: [validar, android-web]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compilar Windows PC portatil
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          test -f electron/preload.js
          npm install --no-audit --no-fund
          npx electron-builder --win portable --x64 --publish never --config.win.artifactName='SOS-VALENCIO-PC-${version}-${arch}.${ext}'
          ls dist-pc/*.exe
      - name: Publicar EXE na mesma Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "rc-integrada-${GITHUB_RUN_NUMBER}" dist-pc/*.exe --repo "${GITHUB_REPOSITORY}" --clobber

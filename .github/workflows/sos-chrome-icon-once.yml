name: "One-time S.O.S. Chrome icon synchronization"
on:
  push:
    branches: [homologacao]
    paths:
      - '.github/workflows/sos-chrome-icon-once.yml'
permissions:
  contents: write
jobs:
  sync-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved homologacao branch
        uses: actions/checkout@v4
        with:
          ref: homologacao
      - name: Generate only desktop browser icon files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Image.open('assets/icon-192.png').convert('RGBA')
          assert src.size==(192,192), 'Icon source must be the approved 192px logo'
          src.resize((512,512),Image.Resampling.LANCZOS).save('assets/icon-512.png',format='PNG',optimize=True)
          src.save('favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64)])
          Image.open('assets/icon-512.png').verify()
          assert Path('favicon.ico').stat().st_size > 1000
          print('S.O.S. icon 192 -> 512 and favicon.ico created from same logo.')
          PY
      - name: Commit only browser icon binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icon-512.png favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m 'fix(icon): match Chrome desktop icon to approved S.O.S. logo'
            git push origin HEAD:homologacao
          fi

/* Hardening responsivo isolado: evita estouro sem esconder dados da OS */
html,body{width:100%;max-width:100%;overflow-x:clip}
header,main,.resumo,#lista,.os,.toolbar,.linha{min-width:0;max-width:100%}
header h1,header small,.os .placa,.os h2,.etiqueta,#filtroTexto{overflow-wrap:anywhere;word-break:normal}
.resumo .indicador{min-width:0;overflow-wrap:break-word}
.resumo .indicador span{overflow-wrap:anywhere}
.toolbar input,.toolbar button{max-width:100%}
#fabioConsulta{height:100vh;height:100dvh;max-width:100%;overscroll-behavior:contain}
#fabioConsulta .consulta-topo{min-width:0;max-width:100%;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
#fabioConsulta .consulta-topo h2{min-width:0;overflow-wrap:anywhere}
#fabioConsulta .consulta-topo button{min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere;line-height:1.2}
#fabioConsulta .consulta-rolagem{min-height:0;min-width:0;width:100%;max-width:100%;padding-bottom:max(16px,env(safe-area-inset-bottom))}
#fabioConsulta .consulta-folha{width:100%;min-width:0;max-width:900px;overflow-wrap:anywhere}
#fabioConsulta .consulta-timbre{min-width:0;max-width:100%}
#fabioConsulta .consulta-identidade,#fabioConsulta .consulta-identidade>div{min-width:0}
#fabioConsulta .consulta-timbre .tipo{min-width:0;max-width:100%;white-space:normal;overflow-wrap:anywhere;text-align:right}
#fabioConsulta .consulta-valor{white-space:normal;overflow-wrap:anywhere}
#fabioConsulta .consulta-dados{table-layout:fixed}
#fabioConsulta .consulta-dados th,#fabioConsulta .consulta-dados td{overflow-wrap:anywhere;word-break:normal}

#fabioConsulta .consulta-total>*{min-width:0;overflow-wrap:anywhere}

.pdf-box{max-height:100%;min-height:0;min-width:0}
.pdf-cabecalho{min-width:0}

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const tid=sessionStorage.getItem('j_tid');
const role=(sessionStorage.getItem('j_role')||'').toLowerCase();
const cargo=(sessionStorage.getItem('j_cargo')||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
if(!tid || tid==='MASTER_ADMIN' || (!['admin','gestor'].includes(role) && cargo!=='gestor')){
  // Atalho do iPhone / nova aba sem sessao: abre login, nunca deixa usuario preso na tela.
  window.location.replace('index.html?destino=fabio.html');
  return;
}
let os=[],clientes=new Map(),veiculos=new Map(),filtro='todos',busca='';

const funcionarios=new Map(),comissoesPorOS=new Map();
let comissoesCarregadas=false,comissoesErro=false;
const definido=v=>v!==null&&v!==undefined&&String(v).trim()!=='';
const primeiro=(...valores)=>valores.find(definido)||'';
function dadosVeiculo(o){
 const v=veiculos.get(o.veiculoId)||o.veiculoSnapshot||{},c=clientes.get(o.clienteId)||{};
 return {v,c,placa:texto(primeiro(o.placa,v.placa,'SEM PLACA')),
 prefixo:texto(primeiro(o.prefixo,o.prefixoVeiculo,v.prefixo,v.prefixoVeiculo)),
 marca:texto(primeiro(v.marca,o.veiculoSnapshot?.marca,o.marca)),
 modelo:texto(primeiro(v.modelo,o.veiculoSnapshot?.modelo,o.veiculoModelo,o.modeloVeiculo,o.modelo,o.veiculo,'Modelo não informado')),
 cliente:texto(primeiro(c.nome,c.razaoSocial,o.clienteNome,o.cliente,'Cliente não informado')),
 ano:texto(primeiro(v.anoModelo,v.ano,o.anoModelo,o.ano)),km:texto(primeiro(o.km,v.km,o.quilometragem)),
 patrimonio:texto(primeiro(o.patrimonio,v.patrimonio,v.numeroPatrimonio)),
 chassi:texto(primeiro(o.chassi,v.chassis,v.chassi,o.chassis)),
 cor:texto(primeiro(v.cor,o.cor)),combustivel:texto(primeiro(v.combustivel,o.combustivel))};
}
function pagamentosOS(o){return comissoesPorOS.get(String(o.id))||[];}
function mecanicosDaOS(o){
 const mapa=new Map();
 function adicionar(id,nome,ativo=false){
  id=texto(id).trim();nome=texto(nome).trim();
  if(!id&&!nome)return;
  const funcionario=funcionarios.get(id)||{};
  const n=texto(primeiro(funcionario.nome,nome,id?'Mecânico '+id:''));
  const key=id?'id:'+id:'nome:'+normal(n),old=mapa.get(key);
  mapa.set(key,{id,nome:n,ativo:!!ativo||!!old?.ativo});
 }
 adicionar(o.mecId,o.mecNome);
 (Array.isArray(o.mecIds)?o.mecIds:[]).forEach(x=>adicionar(x?.id||x?.mecId||x,x?.nome));
 (Array.isArray(o.mecanicos)?o.mecanicos:[]).forEach(x=>adicionar(x?.id||x?.mecId||x,x?.nome||x?.mecNome));
 const exec=o.execucaoItens||{};
 (Array.isArray(o.servicos)?o.servicos:[]).forEach((sv,i)=>{
  const e=exec['servico-'+i]||{},ativo=['em_execucao','em execucao'].includes(normal(e.status));
  const atribuicoes=Array.isArray(sv.rateiosComissao)&&sv.rateiosComissao.length?sv.rateiosComissao:[{mecId:sv.mecId||sv.mecanicoId||sv.responsavelId,mecNome:sv.mecNome||sv.mecanicoNome||sv.responsavelNome}];
  atribuicoes.forEach(r=>adicionar(r.mecId||r.id,r.mecNome||r.nome,ativo));
  adicionar(e.mecId||e.responsavelId,e.mecNome||e.responsavelNome,ativo);
 });
 Object.values(exec).forEach(e=>{if(e&&typeof e==='object')adicionar(e.mecId||e.responsavelId,e.mecNome||e.responsavelNome,normal(e.status)==='em_execucao');});
 (o.comissaoOficialOS?.rateios||[]).forEach(r=>adicionar(r.mecId||r.id,r.mecNome||r.nome));
 Object.keys(o.comissaoControleV26||{}).forEach(id=>adicionar(id,''));
 pagamentosOS(o).forEach(x=>adicionar(x.mecId,x.mecNome));
 const todos=[...mapa.values()];
 return todos.filter(m=>m.id||!todos.some(x=>x.id&&normal(x.nome)===normal(m.nome)));
}
const foiPago=f=>['pago','liquidado','baixado','parcial'].includes(normal(f.status))||!!f.pagoEm||!!f.dataPgto;
const foiCancelado=f=>['cancelado','cancelada','compensado'].includes(normal(f.status))||f.canceladoPorReemissaoOS===true;
function comissaoMec(o,m){
 if(!comissoesCarregadas)return {estado:comissoesErro?'indisponivel':'carregando',rotulo:comissoesErro?'Consulta financeira indisponível':'Verificando pagamentos'};
 const lancamentos=pagamentosOS(o).filter(f=>!foiCancelado(f)&&m.id&&String(f.mecId||'')===String(m.id));
 const pagos=lancamentos.filter(foiPago),abertos=lancamentos.filter(f=>!foiPago(f));
 const valorPago=pagos.reduce((v,f)=>v+(Number(f.valor)||0),0);
 const valorPendente=abertos.reduce((v,f)=>v+(Number(f.valor)||0),0);
 const ultimo=pagos.slice().sort((a,b)=>String(b.pagoEm||b.dataPgto||b.updatedAt||'').localeCompare(String(a.pagoEm||a.dataPgto||a.updatedAt||'')))[0];
 if(valorPago>0&&normal(ultimo?.situacaoComissao)==='quitada'&&valorPendente<.005)
  return {estado:'quitada',rotulo:'Comissão quitada',pago:valorPago,pendente:0};
 if(valorPago>0)return {estado:'registrada',rotulo:normal(ultimo?.situacaoComissao)==='parcial'||valorPendente>0?'Pagamento parcial':'Pagamento registrado (quitação não confirmada)',pago:valorPago,pendente:valorPendente};
 if(valorPendente>0)return {estado:'pendente',rotulo:'Pagamento pendente',pago:0,pendente:valorPendente};
 const control=o.comissaoControleV26?.[m.id];
 if(control?.pagosCentavos&&Object.values(control.pagosCentavos).some(n=>Number(n)>0))
  return {estado:'conferir',rotulo:'Há controle de pagamento na OS; conferir financeiro'};
 return {estado:'sem-registro',rotulo:'Sem pagamento registrado',pago:0};
}
function resumoComissao(o){
 const mecs=mecanicosDaOS(o);
 if(!mecs.length)return {label:'MECÂNICO NÃO VINCULADO',classe:'yellow'};
 if(!comissoesCarregadas)return {label:comissoesErro?'COMISSÃO: CONSULTA INDISPONÍVEL':'COMISSÃO: VERIFICANDO...',classe:'yellow'};
 const estados=mecs.map(m=>comissaoMec(o,m).estado),q=estados.filter(x=>x==='quitada').length,r=estados.filter(x=>x==='registrada').length,p=estados.filter(x=>x==='pendente').length,n=mecs.length-q-r-p;
 if(q===mecs.length)return {label:'COMISSÕES QUITADAS ('+q+')',classe:'green'};
 return {label:'COMISSÕES: '+[q?q+' quitada(s)':'',r?r+' com pagamento':'',p?p+' pendente(s)':'',n?n+' sem confirmação':''].filter(Boolean).join(' · '),classe:'yellow'};
}
window.__fabioVeiculoOS=dadosVeiculo;
window.__fabioMecanicosOS=mecanicosDaOS;
window.__fabioComissaoMecOS=comissaoMec;

const unsub=[];
function texto(x){return x==null?'':String(x);}
function normal(s){return texto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function valorStatus(o){return normal(o.status||'Triagem').trim();}
function pronto(o){return ['pronto','finalizado','concluido'].includes(valorStatus(o));}
function entregue(o){return valorStatus(o)==='entregue';}
function servico(o){return ['andamento','em andamento','em servico','execucao','em execucao'].includes(valorStatus(o));}
function aguardando(o){return ['triagem','orcamento','orcamento_enviado','orcamento enviado','aguardando aprovacao','aguardando_aprovacao'].includes(valorStatus(o));}
function recebeu(o){const n=Number(o.valorRecebidoOperacional);return o.recebidaOperacional===true||(Number.isFinite(n)&&n>0);}
function indicadorStatus(o){
 const s=valorStatus(o), rotulos={triagem:'Triagem',orcamento:'Orçamento',orcamento_enviado:'Orçamento enviado',aprovado:'Aprovado',andamento:'Em serviço',pronto:'Pronto',entregue:'Entregue'};
 return {titulo:rotulos[s]||texto(o.status||'Triagem'),classe:(pronto(o)||entregue(o))?'green':aguardando(o)?'yellow':'blue'};
}
function campo(el,classe,txt){const d=document.createElement(el);if(classe)d.className=classe;d.textContent=texto(txt);return d;}
function add(parent,el,classe,txt){const e=campo(el,classe,txt);parent.appendChild(e);return e;}
function dados(o){return dadosVeiculo(o);}
function pertence(o){if(filtro==='aguardando')return aguardando(o);if(filtro==='servico')return servico(o);if(filtro==='prontos')return pronto(o);if(filtro==='entregues')return entregue(o);return true;}
function render(){
 const validos=os.filter(o=>normal(o.status)!=='cancelado'&&!o.deletedAt);
 $('nAguardando').textContent=validos.filter(aguardando).length;
 $('nServico').textContent=validos.filter(servico).length;
 $('nProntos').textContent=validos.filter(pronto).length;
 $('nEntregues').textContent=validos.filter(entregue).length;
 $('filtroTexto').textContent=({todos:'Todas as O.S.',aguardando:'Aguardando',servico:'Em serviço',prontos:'Prontos',entregues:'Entregues'})[filtro]+' • '+validos.length+' O.S. cadastradas';
 window.__fabioListaOS=os;window.__fabioDadosAtuais={os,clientes:[...clientes.values()],veiculos:[...veiculos.values()],oficina:(function(){try{return JSON.parse(sessionStorage.getItem('j_oficina')||'null')}catch(e){return null}})()};
 window.fabioAtualizarOSAberta?.();
 const lista=$('lista');lista.replaceChildren();
 let exibidos=validos.filter(o=>{
   if(!pertence(o))return false;
   const d=dados(o);
   return !busca||normal([d.placa,d.prefixo,d.patrimonio,d.chassi,d.marca,d.modelo,d.ano,d.cliente,o.numero,o.numeroOS,o.prisma,o.numeroPrisma,...mecanicosDaOS(o).map(m=>m.nome)].join(' ')).includes(busca);
 });
 exibidos.sort((a,b)=>{const va=a.updatedAt||a.createdAt||0,vb=b.updatedAt||b.createdAt||0;const num=x=>typeof x==='number'?x:x?.seconds?x.seconds*1000:Date.parse(x)||0;return num(vb)-num(va);});
 if(!exibidos.length){let mensagem='Nenhuma O.S. encontrada.';
  if(busca){const v=[...veiculos.values()].find(v=>normal([v.placa,v.modelo,v.marca,v.prefixo].join(' ')).includes(busca));
   if(v&&!validos.some(o=>o.veiculoId===v.id||(v.placa&&normal(o.placa)===normal(v.placa))))mensagem='Veículo cadastrado, mas não foi localizada uma O.S.';
  }add(lista,'p','empty',mensagem);return;}
 for(const o of exibidos){
   const d=dados(o),s=indicadorStatus(o);
   const card=add(lista,'article','os','');
   add(card,'div','muted','OS #'+texto(o.numero||o.numeroOS||o.id).slice(0,20));
   if(d.prefixo)add(card,'div','prefixo-destaque','VIATURA • PREFIXO '+d.prefixo);
   add(card,'div','placa',d.placa);
   add(card,'h2','',[d.marca,d.modelo].filter(Boolean).join(' '));
   add(card,'div','muted',[d.ano?'Ano '+d.ano:'',d.km?'KM '+d.km:'',d.patrimonio?'Patrimônio '+d.patrimonio:''].filter(Boolean).join(' • '));
   add(card,'div','muted',d.cliente);
   const mecs=mecanicosDaOS(o),ativos=mecs.filter(m=>m.ativo);
   add(card,'div','resumo-equipe',ativos.length?'EM ATENDIMENTO: '+ativos.map(m=>m.nome).join(', '):'MECÂNICOS VINCULADOS: '+(mecs.length?mecs.map(m=>m.nome).join(', '):'Não vinculados'));
   const resumoC=resumoComissao(o);
   add(card,'div','resumo-comissao '+resumoC.classe,resumoC.label);
   const badges=add(card,'div','linha','');
   add(badges,'span','etiqueta green','O.S. FEITA');
   add(badges,'span','etiqueta '+s.classe,s.titulo.toUpperCase());
   const pagamento=add(card,'div','linha','');
   add(pagamento,'span','etiqueta '+(recebeu(o)?'green':'yellow'),recebeu(o)?'💰 RECEBIMENTO MARCADO':'💰 RECEBIMENTO NÃO MARCADO');
   if(valorStatus(o)==='aprovado')add(pagamento,'span','etiqueta green','APROVADA');
   else if(aguardando(o))add(pagamento,'span','etiqueta yellow','AGUARDANDO APROVAÇÃO');
   add(card,'div','card-abrir','TOQUE PARA ABRIR A O.S. →');
   card.tabIndex=0;card.setAttribute('role','button');
   card.setAttribute('aria-label','Ver ordem de serviço '+texto(o.numero||o.id)+' do veículo '+d.placa);
   card.addEventListener('click',()=>window.fabioAbrirConsultaOS?.(o.id));
   card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();window.fabioAbrirConsultaOS?.(o.id);}});
 }
}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
 filtro=filtro===b.dataset.filter?'todos':b.dataset.filter;
 document.querySelectorAll('.indicador').forEach(x=>x.classList.toggle('active',x.dataset.filter===filtro));
 render();
}));
$('busca').addEventListener('input',e=>{busca=normal(e.target.value.trim());render();});
$('limpar').addEventListener('click',()=>{$('busca').value='';busca='';filtro='todos';document.querySelectorAll('.indicador').forEach(x=>x.classList.remove('active'));render();});
$('sair').addEventListener('click',async()=>{
  unsub.forEach(f=>{try{f();}catch(_){}});
  try{sessionStorage.clear();}catch(_){}
  try{['j_saved_login','j_saved_brand','j_last_user','j_role_master'].forEach(k=>localStorage.removeItem(k));}catch(_){}
  try{if(firebase?.auth&&firebase.apps.length)await Promise.race([firebase.auth().signOut(),new Promise(r=>setTimeout(r,900))]);}catch(_){}
  window.location.replace('index.html?logout=1');
});
try{
 const db=window.initFirebase();
 function acompanhar(col,update){
  unsub.push(db.collection(col).where('tenantId','==',tid).onSnapshot(s=>{
   update(s.docs.map(d=>({id:d.id,...d.data()})));
   $('statusConexao').textContent='Atualizado em tempo real • somente leitura';
   render();
  },err=>{$('erro').textContent='Não foi possível ler '+col+'. Verifique conexão e permissões.';$('statusConexao').textContent='Consulta indisponível';console.error(err);}));
 }
 acompanhar('ordens_servico',items=>{os=items;window.fabioLimparCacheOS?.();});
 acompanhar('clientes',items=>clientes=new Map(items.map(x=>[x.id,x])));
 acompanhar('veiculos',items=>veiculos=new Map(items.map(x=>[x.id,x])));
 acompanhar('funcionarios',items=>{funcionarios.clear();items.forEach(v=>funcionarios.set(String(v.id),v));});
 // Consulta restrita aos documentos de comissão desta oficina. Não carrega o caixa inteiro.
 unsub.push(db.collection('financeiro').where('tenantId','==',tid).where('isComissao','==',true).onSnapshot(snap=>{
  comissoesPorOS.clear();
  snap.docs.forEach(d=>{
   const x={id:d.id,...d.data()};
   if(!x.isComissao||String(x.tenantId)!==tid||!x.osId)return;
   const id=String(x.osId);
   if(!comissoesPorOS.has(id))comissoesPorOS.set(id,[]);
   comissoesPorOS.get(id).push(x);
  });
  comissoesCarregadas=true;comissoesErro=false;render();
 },e=>{
  console.warn('[Fábio] comissão indisponível',e);
  comissoesCarregadas=false;comissoesErro=true;render();
 }));
}catch(err){$('erro').textContent='Falha ao conectar ao sistema. Faça login novamente.';console.error(err);}
})();
</script>

 const marca='<scr'+'ipt src="js/config.js?v=26.13.0"></scr'+'ipt>';
 if(!fonte.includes(marca))throw Error('A versão do JARVIS mudou. Geração bloqueada para preservar o PDF original.');
 fonte=fonte.replace(marca,bloqueio+'\n'+marca);

 frame.className='pdf-offscreen';
 frame.setAttribute('aria-hidden','true');
 frame.setAttribute('tabindex','-1');
 frame.setAttribute('sandbox','allow-scripts allow-same-origin');

 document.body.appendChild(frame);
 gerador=frame;
 await new Promise((resolve,reject)=>{
   const timeout=setTimeout(()=>reject(Error('O motor do JARVIS não respondeu.')),45000);
   frame.onload=()=>{clearTimeout(timeout);resolve();};
   frame.onerror=()=>{clearTimeout(timeout);reject(Error('Não foi possível carregar o motor de PDF'));};
   frame.srcdoc=fonte;
 });
 const w=frame.contentWindow;
 if(!w?.__fabioProtecaoSomenteLeitura)throw Error('Proteção somente leitura indisponível; PDF bloqueado.');
 if(typeof w.prepOS!=='function'||typeof w.gerarPDFOS!=='function')throw Error('Gerador oficial de OS não disponível.');
 return w;
}
async function garantirLibs(w){
 if(typeof w.jspdf?.jsPDF!=='function'){
  await carregarEspecifico(w,'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
 }

  await carregarEspecifico(w,'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js');

}
function mostrarArquivo(doc){
 arquivo=doc;
 if(linkBlob)URL.revokeObjectURL(linkBlob);

 $('fabioPdfViewer').src=linkBlob+'#toolbar=1&navpanes=0';

async function gerarDoc(id){
 const f=cache.get(id);if(f)return f;
 const w=await iniciarGerador();
 const os=window.__fabioOsFonte?.().find(x=>x.id===id);
 if(!os)throw Error('O.S. não encontrada. Atualize o painel.');
 // Dados de leitura já disponíveis no painel: evita refazer consultas na tela principal.
 const fontes=window.__fabioDadosFonte?.();

 w.J.os=fontes.os.map(x=>({...x}));
 w.J.clientes=fontes.clientes.map(x=>({...x}));
 w.J.veiculos=fontes.veiculos.map(x=>({...x}));
 w.J.oficina=fontes.oficina||w.J.oficina;
 // Prepara os mesmos vínculos de cliente/veículo do editor oficial.
 w.popularSelects?.();
 // Busca apenas as peças de estoque vinculadas à OS, sem trazer o estoque inteiro.
 const idsEstoque=[...new Set((Array.isArray(os.pecas)?os.pecas:[])
  .map(p=>String(p?.estoqueId||'').trim()).filter(id=>id&&!id.includes('/')))];
 if(idsEstoque.length){
  const estoqueSalvo=await Promise.all(idsEstoque.map(id=>w.J.db.collection('estoqueItems').doc(id).get()
   .then(d=>d.exists?{id:d.id,...d.data()}:null).catch(()=>null)));
  w.J.estoque=estoqueSalvo.filter(Boolean);
 }
 // O preenchimento original do formulário monta peças/serviços e evidências reais.
 w.prepOS('edit',id);
 await new Promise(resolve=>setTimeout(resolve,250)); // aguarda a associação de veículo já prevista no JARVIS
 if(w.document.getElementById('osId')?.value!==id)throw Error('A O.S. não foi carregada corretamente.');
 await garantirLibs(w);
 // SalvarBlobArquivoOS é função LOCAL do JARVIS: capturar o próprio Blob exportado e
 // suprimir apenas o download automático dentro do iframe técnico.
 let salvo=null;
 const originalURL=w.URL.createObjectURL.bind(w.URL);
 const originalClick=w.HTMLAnchorElement.prototype.click;
 let ultimoNome='OS.pdf';
 w.URL.createObjectURL=function(blob){
  if(blob?.type==='application/pdf'&&blob.size>0)
   salvo={blob,fileName:ultimoNome,numero:String(os.numero||os.numeroOS||id.slice(-6)).toUpperCase()};
  return originalURL(blob);
 };
 w.HTMLAnchorElement.prototype.click=function(){
  if(this.download&&String(this.download).toLowerCase().endsWith('.pdf')){
   ultimoNome=this.download;
   if(salvo)salvo.fileName=ultimoNome;
   return;
  }
  return originalClick.call(this);
 };
 try{await w.gerarPDFOS();} // PDF ORIGINAL COMPLETO, inclusive fotos
 finally{
  w.URL.createObjectURL=originalURL;
  w.HTMLAnchorElement.prototype.click=originalClick;
 }
 if(!salvo||!salvo.blob||salvo.blob.size<1000)throw Error('O motor original não retornou um PDF válido.');
 if((await salvo.blob.slice(0,5).text())!=='%PDF-')throw Error('Arquivo gerado não é um PDF válido.');
 if(cache.size>=3)cache.delete(cache.keys().next().value);
 cache.set(id,salvo);return salvo;
}
window.__fabioOsFonte=()=>Array.isArray(window.__fabioListaOS)?window.__fabioListaOS:[];
window.__fabioDadosFonte=()=>window.__fabioDadosAtuais||null;
window.fabioAbrirPdfOS=async function(id){

 $('fabioPdfDialog').hidden=false;

function salvarArquivo(){

  navigator.share(dados).catch(e=>{if(e?.name!=='AbortError')estado('Falha ao compartilhar: '+(e?.message||e)+'. Use Baixar PDF para anexar ao WhatsApp.');});

  salvarArquivo();

<script>

(function(){
'use strict';
const byId=id=>document.getElementById(id);
const painel=byId('fabioConsulta'),folha=byId('fabioConsultaFolha');
let aberto=null;
function txt(v){return v===null||v===undefined?'':String(v);}
function first(){for(let i=0;i<arguments.length;i++){const v=arguments[i];if(v!==null&&v!==undefined&&txt(v).trim())return v;}return '';}
function norm(v){return txt(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
function elem(tag,classe,valor,pai){const x=document.createElement(tag);if(classe)x.className=classe;if(valor!==undefined&&valor!==null)x.textContent=txt(valor);if(pai)pai.appendChild(x);return x;}
function num(v){if(typeof v==='number')return Number.isFinite(v)?v:null;if(v===null||v===undefined||v==='')return null;let s=String(v).trim().replace(/[^\d,.-]/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return Number.isFinite(n)?n:null;}
function reais(v){const n=num(v);return n===null?'Não informado':n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function data(v){if(!v)return '';try{const d=v.toDate?v.toDate():v.seconds?new Date(v.seconds*1000):new Date(v);return isNaN(d.getTime())?'':d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function quadro(titulo,conteudo){const sec=elem('section','consulta-bloco',null,folha);elem('h3','consulta-titulo',titulo,sec);elem('div','consulta-quadro',conteudo||'—',sec);return sec;}
function secao(titulo){const sec=elem('section','consulta-bloco',null,folha);elem('h3','consulta-titulo',titulo,sec);return sec;}
function tabela(parent,heads,rows){

 // Cabeçalhos continuam preservados para impressão e acessibilidade.
 const wrap=elem('div','consulta-tabela-rolagem',null,parent);
 const t=elem('table','consulta-itens',null,wrap);
 const tr=elem('tr','',null,elem('thead','',null,t));
 heads.forEach(h=>elem('th','',h,tr));

 for(const row of rows){
  const tr=elem('tr','',null,body);
  row.forEach((v,i)=>{
   const dado=v&&typeof v==='object'?v:null;
   const coluna=elem('td',dado?.classe||'',dado?dado.valor:v,tr);
   const titulo=String(heads[i]||'');
   coluna.dataset.label=titulo;
   if(/descri[cç][aã]o/i.test(titulo))coluna.classList.add('consulta-item-descricao');
   if(/execu[cç][aã]o|aplica[cç][aã]o/i.test(titulo))coluna.classList.add('consulta-item-resultado');
   if(dado?.obs)elem('div',dado.obsTipo||'consulta-pendente',dado.obs,coluna);
  });
 }
 return t;
}
function par(pai,titulo,valor){const item=elem('div','consulta-total',null,pai);elem('span','',titulo,item);elem('strong','',valor,item);return item;}
function tag(pai,valor,tipo){elem('span','consulta-tag '+(tipo||''),valor,pai);}
function valorStatus(o){return norm(o.status||'Triagem');}
function statusItem(e,tipo){const v=norm(e&&e.status);const nomes={pendente:'Pendente',em_execucao:'Em execução',executado:'Serviço executado',nao_executado:'Não executado',trocada:'Peça trocada / executada',nao_encontrada:'Peça não encontrada',nao_trocada:'Não trocada'};return {label:nomes[v]||(!v?'Sem registro de execução':txt(e.status)),classe:(v==='executado'||v==='trocada')?'consulta-acerto':'consulta-pendente'};}
function getInfo(o){
 const f=window.__fabioDadosFonte?window.__fabioDadosFonte():null;
 const c=f&&f.clientes?f.clientes.find(x=>x.id===o.clienteId)||{}:{};
 const v=f&&f.veiculos?f.veiculos.find(x=>x.id===o.veiculoId)||{}:{};
 return {o,c,v,oficina:(f&&f.oficina)||{}};
}
function aprovadoKeys(o){const a=o.aprovacao&&Array.isArray(o.aprovacao.itens)?o.aprovacao.itens:Array.isArray(o.itensAprovados)?o.itensAprovados:null;return a?new Set(a.map(x=>typeof x==='string'?x:x&&x.key).filter(Boolean)):null;}
function fotosOS(o){
 if(window.thiaEvidenciasOS&&typeof window.thiaEvidenciasOS.coletar==='function')return window.thiaEvidenciasOS.coletar(o,{somenteAnexosOS:true}).filter(x=>x.type!=='video');
 const all=[...(Array.isArray(o.fotos)?o.fotos:[]),...(Array.isArray(o.media)?o.media:[])],seen=new Set();
 return all.map(x=>typeof x==='string'?{url:x,type:'image'}:x).filter(x=>{const u=txt(x.url||x.secure_url);if(!/^https?:\/\//i.test(u)||/checklist/i.test(txt(x.origem||x.source))||/\/checklists?\//i.test(u)||seen.has(u)||/^video/i.test(txt(x.type)))return false;seen.add(u);return true;});
}
function pagamento(o){const n=num(o.valorRecebidoOperacional);return o.recebidaOperacional===true||(n!==null&&n>0);}
function montar(id){

 const institucional=elem('div','',null,marca);
 elem('strong','',first(oficina.nomeFantasia,oficina.razaoSocial,window.sessionStorage.getItem('j_tnome'),'S.O.S. VALÊNCIO'),institucional);
 const endereco=first(oficina.enderecoCompleto,[oficina.endereco,oficina.numero,oficina.bairro,oficina.cidade,oficina.uf,oficina.cep].filter(Boolean).join(', '));
 [oficina.cnpj?'CNPJ: '+oficina.cnpj:'',oficina.telefone?'Tel/Whats: '+oficina.telefone:'',endereco,oficina.email].filter(Boolean).forEach(x=>elem('small','',x,institucional));
 elem('div','tipo',c.tipoCliente==='governo'?'ORÇAMENTO / ORDEM DE SERVIÇO':'ORÇAMENTO / O.S.',topo);
 const box=secao('DADOS DA ORDEM DE SERVIÇO');

  ['Veículo',[first(v.marca,o.marca),first(v.modelo,o.veiculo,o.modelo)].filter(Boolean).join(' ')||'—','Placa',first(o.placa,v.placa,'—')],

 ];
 const tb=elem('table','consulta-dados',null,box);const body=elem('tbody','',null,tb);
 detalhes.forEach(row=>{const tr=elem('tr','',null,body);row.forEach((x,i)=>elem(i%2?'td':'th','',x,tr));});

 tag(resumo,'STATUS: '+first(o.status,'Triagem'),['pronto','entregue'].includes(valorStatus(o))?'ok':'warn');
 if(keys){tag(resumo,'APROVAÇÃO: '+keys.size+' item(ns) aprovado(s)','ok');}

    {valor:reais(it.valorFinal),classe:'consulta-valor',obs:aprov+' • '+sts.label+(ex.obs?' — '+ex.obs:''),obsTipo:sts.classe}];

  const img=elem('img','consulta-assinatura-img',null,responsavel);img.src=urlAssinatura;img.alt='Assinatura registrada na O.S.';

 elem('div','',first(assinatura&&assinatura.nomeResponsavel,assinatura&&assinatura.nome,oficina.nomeFantasia,oficina.razaoSocial,'RESPONSÁVEL TÉCNICO')+' / RESPONSÁVEL TÉCNICO',responsavel);
 elem('div','',first(c.nome,o.cliente,'CLIENTE')+' / ASSINATURA DO CLIENTE',ass);
 elem('div','consulta-rodape','Consulta somente leitura • S.O.S. VALÊNCIO • Powered by thIAguinho Soluções Digitais',folha);
}
function fechar(){painel.hidden=true;aberto=null;document.body.style.overflow='';}
window.fabioAbrirConsultaOS=function(id){aberto=id;painel.hidden=false;document.body.style.overflow='hidden';montar(id);painel.querySelector('.consulta-rolagem').scrollTop=0;};
window.fabioAtualizarOSAberta=function(){if(aberto&&!painel.hidden)montar(aberto);};
byId('fabioConsultaVoltar').addEventListener('click',fechar);
byId('fabioConsultaImprimir').addEventListener('click',()=>{if(aberto)window.print();});
byId('fabioConsultaCompartilhar').addEventListener('click',()=>{if(aberto&&typeof window.fabioAbrirPdfOS==='function')window.fabioAbrirPdfOS(aberto);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!painel.hidden)fechar();});
window.addEventListener('afterprint',()=>{if(aberto)document.body.style.overflow='hidden';});
})();

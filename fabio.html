<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071222">
<title>Fábio | Acompanhamento da Oficina</title>
<link rel="icon" href="favicon.ico">
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"></script>
<script src="js/config.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f1f6fc;background:#071222;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input{font:inherit}button{cursor:pointer}
header{padding:20px max(18px,calc((100vw - 1150px)/2));background:#0c1c31;border-bottom:1px solid #243e58;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(1.25rem,3vw,1.85rem);margin:0}header small{color:#a2c7df;font-weight:700;letter-spacing:.07em}
main{max-width:1150px;margin:auto;padding:20px 16px 80px}
button{border-radius:14px;border:1px solid #315069;color:#f6fbff;background:#18304c;padding:12px 16px;min-height:48px;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid #66c5ff;outline-offset:2px}
button:hover{border-color:#68beed}button.active{background:#126c92;border-color:#41caff}
#sair{background:transparent}#erro{color:#ffb9b9;font-size:1rem;font-weight:700;margin:14px 0}
.resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.indicador{background:#10243c;border:1px solid #29445e;border-radius:18px;padding:17px 12px;text-align:left;min-height:106px}
.indicador b{display:block;font-size:2.2rem;line-height:1.15}.indicador span{display:block;color:#c7d7e6;font-size:.95rem;margin-top:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input{flex:1 1 220px;min-width:0;background:#10243c;border:1px solid #34516a;border-radius:14px;color:white;padding:14px;font-size:1.05rem}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.filtros button{flex:1 1 auto}
#lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.os{border:1px solid #31516f;border-radius:19px;background:#10243a;padding:17px;min-width:0}
.os h2{font-size:1.32rem;margin:0 0 6px;overflow-wrap:anywhere}.os .placa{color:#fff;font-weight:900;font-size:1.6rem;letter-spacing:.04em}
.muted{color:#adc4d8}.linha{margin:8px 0;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.etiqueta{display:inline-flex;align-items:center;padding:6px 10px;border-radius:9px;font-size:.9rem;font-weight:800;background:#233f59}
.green{background:#104c37;color:#afffd7}.yellow{background:#62491b;color:#ffe4a2}.red{background:#592729;color:#ffc2c2}.blue{background:#17446c;color:#cceaff}
.detalhes{padding:13px 0 0;border-top:1px solid #28435f;margin-top:14px}.detalhes p{margin:8px 0;overflow-wrap:anywhere}
.full{width:100%;margin-top:12px;background:#145e83}.empty{text-align:center;grid-column:1/-1;color:#b4cde1;padding:40px 10px}
#statusConexao{font-size:.86rem;color:#a1c7d8;margin-top:10px}
@media(max-width:720px){#lista{grid-template-columns:1fr}.resumo{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:17px}.indicador b{font-size:2rem}}
@media(max-width:340px){.resumo{grid-template-columns:1fr 1fr}.indicador{padding:12px 8px}}
</style>
</head>
<body>
<header><div><small>S.O.S. VALÊNCIO • VISÃO DO PROPRIETÁRIO</small><h1>Fábio — Minha Oficina</h1></div><button id="sair" type="button">Sair</button></header>
<main>
<div class="resumo" aria-label="Resumo dos veículos">
<button class="indicador" data-filter="todos"><b id="nTodos">—</b><span>Todos os veículos</span></button>
<button class="indicador" data-filter="aguardando"><b id="nAguardando">—</b><span>Aguardando aprovação</span></button>
<button class="indicador" data-filter="servico"><b id="nServico">—</b><span>Em serviço</span></button>
<button class="indicador" data-filter="prontos"><b id="nProntos">—</b><span>Prontos / entregues</span></button>
</div>
<div class="toolbar"><input id="busca" aria-label="Buscar veículo, placa, cliente ou ordem" placeholder="Buscar placa, veículo, cliente ou O.S." autocomplete="off"><button id="limpar" type="button">Limpar</button></div>
<div class="filtros" aria-label="Filtros rápidos">
<button data-filter="todos" class="active">Todos</button>
<button data-filter="aguardando">Aprovação</button>
<button data-filter="servico">Em serviço</button>
<button data-filter="prontos">Prontos</button>
<button data-filter="recebidos">Recebidos</button>
</div>
<div id="statusConexao" role="status">Conectando ao sistema…</div>
<div id="erro" role="alert"></div>
<section id="lista" aria-label="Ordens de serviço" aria-live="polite"></section>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const tid=sessionStorage.getItem('j_tid');
const role=(sessionStorage.getItem('j_role')||'').toLowerCase();
if(!tid || tid==='MASTER_ADMIN' || !['admin','gestor'].includes(role)){
  $('statusConexao').textContent='É necessário entrar com um perfil de gestor ou administrador autorizado.';
  $('erro').textContent='Acesso não autorizado. Faça login no sistema.';
  document.querySelectorAll('.indicador,.filtros button').forEach(b=>b.disabled=true);
  return;
}
let os=[],clientes=new Map(),veiculos=new Map(),filtro='todos',busca='',abertos=new Set();
const unsub=[];
function texto(x){return x==null?'':String(x);}
function normal(s){return texto(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function valorStatus(o){return normal(o.status||'Triagem').trim();}
function pronto(o){return ['pronto','entregue','finalizado','concluido'].includes(valorStatus(o));}
function servico(o){return ['andamento','em andamento','em servico','execucao','em execucao'].includes(valorStatus(o));}
function aguardando(o){return ['triagem','orcamento','orcamento_enviado','orcamento enviado','aguardando aprovacao','aguardando_aprovacao'].includes(valorStatus(o));}
function recebeu(o){const n=Number(o.valorRecebidoOperacional);return o.recebidaOperacional===true||(Number.isFinite(n)&&n>0);}
function indicadorStatus(o){
 const s=valorStatus(o), rotulos={triagem:'Triagem',orcamento:'Orçamento',orcamento_enviado:'Orçamento enviado',aprovado:'Aprovado',andamento:'Em serviço',pronto:'Pronto',entregue:'Entregue'};
 return {titulo:rotulos[s]||texto(o.status||'Triagem'),classe:pronto(o)?'green':aguardando(o)?'yellow':servico(o)?'blue':'blue'};
}
function campo(el,classe,txt){const d=document.createElement(el);if(classe)d.className=classe;d.textContent=texto(txt);return d;}
function add(parent,el,classe,txt){const e=campo(el,classe,txt);parent.appendChild(e);return e;}
function dados(o){const v=veiculos.get(o.veiculoId)||{};const c=clientes.get(o.clienteId)||{};return {v,c,placa:texto(v.placa||o.placa||v.prefixo||o.prefixo||'SEM PLACA'),modelo:texto(v.modelo||o.veiculo||o.modelo||'Veículo não informado'),cliente:texto(c.nome||o.cliente||'Cliente não informado')};}
function pertence(o){if(filtro==='aguardando')return aguardando(o);if(filtro==='servico')return servico(o);if(filtro==='prontos')return pronto(o);if(filtro==='recebidos')return recebeu(o);return true;}
function render(){
 const validos=os.filter(o=>normal(o.status)!=='cancelado'&&!o.deletedAt);
 $('nTodos').textContent=validos.length;
 $('nAguardando').textContent=validos.filter(aguardando).length;
 $('nServico').textContent=validos.filter(servico).length;
 $('nProntos').textContent=validos.filter(pronto).length;
 const lista=$('lista');lista.replaceChildren();
 let exibidos=validos.filter(o=>{
   if(!pertence(o))return false;
   const d=dados(o);
   return !busca||normal([d.placa,d.modelo,d.cliente,o.numero,o.numeroOS,o.prisma,o.numeroPrisma].join(' ')).includes(busca);
 });
 exibidos.sort((a,b)=>{const va=a.updatedAt||a.createdAt||0,vb=b.updatedAt||b.createdAt||0;const num=x=>typeof x==='number'?x:x?.seconds?x.seconds*1000:Date.parse(x)||0;return num(vb)-num(va);});
 if(!exibidos.length){add(lista,'p','empty','Nenhum veículo encontrado.');return;}
 for(const o of exibidos){
   const d=dados(o),s=indicadorStatus(o);
   const card=add(lista,'article','os','');
   add(card,'div','muted','OS #'+texto(o.numero||o.numeroOS||o.id).slice(0,20));
   add(card,'div','placa',d.placa);
   add(card,'h2','',d.modelo);
   add(card,'div','muted',d.cliente);
   const badges=add(card,'div','linha','');
   add(badges,'span','etiqueta '+s.classe,s.titulo);
   add(badges,'span','etiqueta '+(recebeu(o)?'green':'yellow'),recebeu(o)?'💰 Recebido':'💰 Não marcado como recebido');
   const aberto=abertos.has(o.id);
   const bot=add(card,'button','full',aberto?'Fechar detalhes':'Ver situação completa');
   bot.type='button';bot.setAttribute('aria-expanded',String(aberto));
   if(aberto){
      const detalhe=add(card,'div','detalhes','');
      add(detalhe,'p','','Situação: '+s.titulo);
      const aprov=valorStatus(o)==='aprovado'||servico(o)||pronto(o);
      add(detalhe,'p','','Aprovação: '+(aprov?'Status indica aprovado/etapa posterior':o.aprovacao||o.totalAprovado!=null?'Há registro de aprovação':'Sem confirmação explícita no status'));
      add(detalhe,'p','','Execução: '+(pronto(o)?'Status de pronto/entregue':servico(o)?'Status em serviço':'Consultar andamento da O.S.'));
      add(detalhe,'p','','Recebimento operacional: '+(recebeu(o)?'Marcado como recebido':'Ainda não marcado como recebido'));
      if(Number(o.valorRecebidoOperacional)>0){add(detalhe,'p','','Valor marcado: '+Number(o.valorRecebidoOperacional).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}));}
      add(detalhe,'p','muted','Consulta somente leitura. Nenhum dado é alterado.');
   }
   bot.addEventListener('click',()=>{if(abertos.has(o.id))abertos.delete(o.id);else abertos.add(o.id);render();});
 }
}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
 filtro=b.dataset.filter;
 document.querySelectorAll('.filtros button').forEach(x=>x.classList.toggle('active',x.dataset.filter===filtro));
 render();
}));
$('busca').addEventListener('input',e=>{busca=normal(e.target.value.trim());render();});
$('limpar').addEventListener('click',()=>{$('busca').value='';busca='';filtro='todos';document.querySelectorAll('.filtros button').forEach(x=>x.classList.toggle('active',x.dataset.filter===filtro));render();});
$('sair').addEventListener('click',()=>{unsub.forEach(f=>f());sessionStorage.removeItem('j_tid');sessionStorage.removeItem('j_role');location.replace('index.html');});
try{
 const db=window.initFirebase();
 function acompanhar(col,update){
  unsub.push(db.collection(col).where('tenantId','==',tid).onSnapshot(s=>{
   update(s.docs.map(d=>({id:d.id,...d.data()})));
   $('statusConexao').textContent='Atualizado em tempo real • somente leitura';
   render();
  },err=>{$('erro').textContent='Não foi possível ler '+col+'. Verifique conexão e permissões.';$('statusConexao').textContent='Consulta indisponível';console.error(err);}));
 }
 acompanhar('ordens_servico',items=>os=items);
 acompanhar('clientes',items=>clientes=new Map(items.map(x=>[x.id,x])));
 acompanhar('veiculos',items=>veiculos=new Map(items.map(x=>[x.id,x])));
}catch(err){$('erro').textContent='Falha ao conectar ao sistema. Faça login novamente.';console.error(err);}
})();
</script>
</body>
</html>
